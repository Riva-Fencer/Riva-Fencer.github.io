// Coordinate system with increased fencer scale
const BASE_WIDTH = 820;
const BASE_HEIGHT = 440;
const GROUND_Y = 328;
const SCALE_FACTOR = 1.32; // Increases character size for clear visibility

function setupHiDPI() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = BASE_WIDTH * dpr;
    canvas.height = BASE_HEIGHT * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// Immediate execution on launch
setupHiDPI();
window.addEventListener('resize', setupHiDPI);
window.addEventListener('orientationchange', () => setTimeout(setupHiDPI, 50));
document.addEventListener('DOMContentLoaded', setupHiDPI);

let isMuted = false;
let audioUnlocked = false;

function initAudio() {
    audioUnlocked = true;
}

function toggleAudio() {
    isMuted = !isMuted;
    if (isMuted) {
        audioOnIcon.style.display = 'none';
        audioMuteIcon.style.display = 'block';
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    } else {
        audioOnIcon.style.display = 'block';
        audioMuteIcon.style.display = 'none';
        initAudio();
    }
}

function speakCoachingCue(marathiString) {
    if (isMuted) return;
    if (window.AndroidBridge && window.AndroidBridge.speakMarathi) {
        window.AndroidBridge.speakMarathi(marathiString);
        return;
    }
    if (!('speechSynthesis' in window) || !audioUnlocked) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(marathiString);
    utterance.lang = 'mr-IN';
    utterance.rate = 0.88;
    window.speechSynthesis.speak(utterance);
}

let activeErrorZones = [];
let visualRipples = [];

function registerErrorZone(id, x, y, radius, onCorrectCallback) {
    activeErrorZones.push({ id, x, y, radius, onCorrect: onCorrectCallback });
}

function clearErrorZones() {
    activeErrorZones = [];
}

function getCanvasPointerPos(evt) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = BASE_WIDTH / rect.width;
    const scaleY = BASE_HEIGHT / rect.height;
    const clientX = evt.clientX !== undefined ? evt.clientX : (evt.touches && evt.touches[0] ? evt.touches[0].clientX : 0);
    const clientY = evt.clientY !== undefined ? evt.clientY : (evt.touches && evt.touches[0] ? evt.touches[0].clientY : 0);
    return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
    };
}

function spawnSuccessRipple(x, y) {
    visualRipples.push({ x, y, radius: 10, maxRadius: 40, alpha: 1.0, color: '#22c55e' });
}

function spawnMissNotice(x, y) {
    visualRipples.push({ x, y, radius: 5, maxRadius: 24, alpha: 0.8, color: '#ef4444' });
}

function updateAndDrawRipples() {
    for (let i = visualRipples.length - 1; i >= 0; i--) {
        const r = visualRipples[i];
        r.radius += 2.0;
        r.alpha -= 0.04;
        if (r.alpha <= 0) {
            visualRipples.splice(i, 1);
            continue;
        }
        ctx.save();
        ctx.strokeStyle = r.color;
        ctx.globalAlpha = r.alpha;
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
    }
}

function drawActiveErrorReticles() {
    const pulse = Math.sin(performance.now() * 0.008) * 4;
    activeErrorZones.forEach(zone => {
        ctx.save();
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 2.2;
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.arc(zone.x, zone.y, zone.radius + pulse, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(239, 68, 68, 0.22)';
        ctx.fill();
        ctx.restore();
    });
}

function resolveErrorCorrectionTap(clickX, clickY) {
    let corrected = false;
    for (let i = activeErrorZones.length - 1; i >= 0; i--) {
        const zone = activeErrorZones[i];
        const dist = Math.hypot(clickX - zone.x, clickY - zone.y);
        if (dist <= zone.radius) {
            spawnSuccessRipple(zone.x, zone.y);
            zone.onCorrect();
            corrected = true;
            break;
        }
    }
    if (!corrected && activeErrorZones.length > 0) {
        spawnMissNotice(clickX, clickY);
    }
}

canvas.addEventListener('pointerup', (e) => {
    const pos = getCanvasPointerPos(e);
    resolveErrorCorrectionTap(pos.x, pos.y);
});

let hitStopUntil = 0;
let screenShakeRemaining = 0;
let screenShakeMagnitude = 0;
let wasInContactPreviousFrame = false;

function triggerHitStop(freezeMs, shakeIntensity) {
    const now = performance.now();
    hitStopUntil = now + freezeMs;
    screenShakeRemaining = freezeMs;
    screenShakeMagnitude = shakeIntensity;
}

function applyCameraTransform() {
    ctx.save();
    if (screenShakeRemaining > 0) {
        const shakeX = (Math.random() - 0.5) * screenShakeMagnitude * 2;
        const shakeY = (Math.random() - 0.5) * screenShakeMagnitude * 2;
        ctx.translate(shakeX, shakeY);
        screenShakeRemaining -= 16.6;
        if (screenShakeRemaining <= 0) screenShakeMagnitude = 0;
    }
}

function restoreCameraTransform() {
    ctx.restore();
}

let effectiveElapsed = 0;
let lastFrameTime = performance.now();
let isPaused = true;
let currentDrill = 0;
let currentSubPhase = -1;
let playbackMultiplier = 1.0;

function updateDrillStateMachine(currentTimeMs) {
    const drillIdx = Math.floor(currentTimeMs / DRILL_DURATION);
    const localTime = currentTimeMs % DRILL_DURATION;
    const config = drillTimelineConfigs[drillIdx];
    if (!config) return;

    // Smooth circular countdown
    const remainingSeconds = Math.max(0, Math.ceil((DRILL_DURATION - localTime) / 1000));
    timerNumber.innerText = `${remainingSeconds}s`;
    const progressPercent = (localTime / DRILL_DURATION) * 100;
    timerProgress.setAttribute('stroke-dashoffset', progressPercent);

    let targetPhase = config.phases[0];
    for (let i = config.phases.length - 1; i >= 0; i--) {
        if (localTime >= config.phases[i].startTime) {
            targetPhase = config.phases[i];
            break;
        }
    }

    if (currentDrill !== drillIdx || currentSubPhase !== targetPhase.subPhase) {
        currentDrill = drillIdx;
        currentSubPhase = targetPhase.subPhase;

        drillTitle.innerText = config.title;
        statusBox.innerText = targetPhase.status;
        speakCoachingCue(targetPhase.marathiText);
    }
}

// Hold gesture handlers for Speed & Skipping
let holdTimer = null;
let isHolding = false;

function setSpeedUI(speedText, isVisible) {
    if (isVisible) {
        speedBadge.innerText = speedText;
        speedBadge.style.display = 'block';
    } else {
        speedBadge.style.display = 'none';
    }
}

btnPrev.addEventListener('pointerdown', () => {
    initAudio();
    isHolding = false;
    btnPrev.classList.add('pressing');
    holdTimer = setTimeout(() => {
        isHolding = true;
        playbackMultiplier = 0.25;
        setSpeedUI("०.२५x स्लो-मोशन", true);
    }, 240);
});

btnPrev.addEventListener('pointerup', () => {
    clearTimeout(holdTimer);
    btnPrev.classList.remove('pressing');
    if (isHolding) {
        playbackMultiplier = 1.0;
        setSpeedUI("", false);
        isHolding = false;
    } else {
        switchDrill(Math.max(0, currentDrill - 1));
    }
});

btnPrev.addEventListener('pointercancel', () => {
    clearTimeout(holdTimer);
    btnPrev.classList.remove('pressing');
    playbackMultiplier = 1.0;
    setSpeedUI("", false);
});

btnNext.addEventListener('pointerdown', () => {
    initAudio();
    isHolding = false;
    btnNext.classList.add('pressing');
    holdTimer = setTimeout(() => {
        isHolding = true;
        playbackMultiplier = 2.5;
        setSpeedUI("२.५x फास्ट फॉरवर्ड", true);
    }, 240);
});

btnNext.addEventListener('pointerup', () => {
    clearTimeout(holdTimer);
    btnNext.classList.remove('pressing');
    if (isHolding) {
        playbackMultiplier = 1.0;
        setSpeedUI("", false);
        isHolding = false;
    } else {
        switchDrill(Math.min(drillTimelineConfigs.length - 1, currentDrill + 1));
    }
});

btnNext.addEventListener('pointercancel', () => {
    clearTimeout(holdTimer);
    btnNext.classList.remove('pressing');
    playbackMultiplier = 1.0;
    setSpeedUI("", false);
});

function solveLegIK(hx, hy, ax, ay, l1, l2, bendForward = true) {
    const dx = ax - hx;
    const dy = ay - hy;
    let d = Math.hypot(dx, dy);
    d = Math.min(d, l1 + l2 - 0.001);
    d = Math.max(d, Math.abs(l1 - l2) + 0.001);

    const baseAngle = Math.atan2(dy, dx);
    const cosA = (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d);
    const offset = Math.acos(Math.max(-1, Math.min(1, cosA)));
    const angle = bendForward ? (baseAngle - offset) : (baseAngle + offset);

    return {
        kx: hx + Math.cos(angle) * l1,
        ky: hy + Math.sin(angle) * l1
    };
}

function drawAnatomicalContouredLeg(hx, hy, kx, ky, ax, ay, isFront) {
    ctx.save();
    const baseColor = isFront ? '#f8fafc' : '#cbd5e1';
    const shadeColor = isFront ? '#cbd5e1' : '#94a3b8';
    const seamColor = isFront ? '#94a3b8' : '#64748b';

    const fAngle = Math.atan2(ky - hy, kx - hx);
    const fPerp = fAngle + Math.PI / 2;
    const qMidX = (hx + kx) * 0.5;
    const qMidY = (hy + ky) * 0.5;
    const qBulge = isFront ? 4.8 : 2.8;

    ctx.fillStyle = baseColor;
    ctx.strokeStyle = seamColor;
    ctx.lineWidth = 1.3;

    ctx.beginPath();
    ctx.moveTo(hx - Math.cos(fPerp) * 7.5, hy - Math.sin(fPerp) * 7.5);
    ctx.quadraticCurveTo(qMidX + Math.cos(fPerp) * (8 + qBulge), qMidY + Math.sin(fPerp) * (8 + qBulge), kx + Math.cos(fPerp) * 5.8, ky + Math.sin(fPerp) * 5.8);
    ctx.lineTo(kx - Math.cos(fPerp) * 5.2, ky - Math.sin(fPerp) * 5.2);
    ctx.quadraticCurveTo(qMidX - Math.cos(fPerp) * 5.8, qMidY - Math.sin(fPerp) * 5.8, hx + Math.cos(fPerp) * 7.0, hy + Math.sin(fPerp) * 7.0);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    const tAngle = Math.atan2(ay - ky, ax - kx);
    const tPerp = tAngle + Math.PI / 2;
    const cMidX = (kx + ax) * 0.5;
    const cMidY = (ky + ay) * 0.5;
    const cBulge = isFront ? -5.2 : -3.2;

    ctx.beginPath();
    ctx.moveTo(kx + Math.cos(tPerp) * 5.5, ky + Math.sin(tPerp) * 5.5);
    ctx.quadraticCurveTo(cMidX + Math.cos(tPerp) * (6.5 + cBulge), cMidY + Math.sin(tPerp) * (6.5 + cBulge), ax + Math.cos(tPerp) * 4.0, ay + Math.sin(tPerp) * 4.0);
    ctx.lineTo(ax - Math.cos(tPerp) * 3.8, ay - Math.sin(tPerp) * 3.8);
    ctx.quadraticCurveTo(cMidX - Math.cos(tPerp) * 5.2, cMidY - Math.sin(tPerp) * 5.2, kx - Math.cos(tPerp) * 4.8, ky - Math.sin(tPerp) * 4.8);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = shadeColor;
    ctx.beginPath();
    ctx.arc(kx, ky, 3.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

function drawAuthenticShoe(x, y, tiltDeg, isFront, isTurned90, facingLeft = false) {
    ctx.save();
    ctx.translate(x, y);
    if (facingLeft) ctx.scale(-1, 1);
    ctx.rotate((tiltDeg * Math.PI) / 180);

    ctx.fillStyle = '#0284c7';
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.2;

    if (isTurned90) {
        ctx.beginPath();
        ctx.roundRect(-8, -9, 16, 9, [4, 4, 2, 2]);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(-8, -3, 16, 3);
    } else {
        ctx.beginPath();
        ctx.moveTo(-10, -9);
        ctx.lineTo(6, -9);
        ctx.quadraticCurveTo(15, -5, 16, -1);
        ctx.lineTo(-10, -1);
        ctx.quadraticCurveTo(-12, -5, -10, -9);
        ctx.closePath();
        ctx.fill(); ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.roundRect(-10, -3, 26, 3, [1, 1, 1, 1]);
        ctx.fill();
    }
    ctx.restore();
}

function drawFoilLameVest(pelvisX, pelvisY, shoulderX, shoulderY, isOpponent, isError = false) {
    ctx.save();
    ctx.fillStyle = isError ? '#fca5a5' : (isOpponent ? '#475569' : '#0284c7');
    ctx.strokeStyle = isError ? '#ef4444' : '#38bdf8';
    ctx.lineWidth = 1.6;

    ctx.beginPath();
    ctx.moveTo(shoulderX - 12, shoulderY + 9);
    ctx.lineTo(shoulderX + 12, shoulderY + 9);
    ctx.lineTo(pelvisX + 10, pelvisY);
    ctx.quadraticCurveTo(pelvisX, pelvisY + 6, pelvisX - 10, pelvisY);
    ctx.lineTo(shoulderX - 12, shoulderY + 9);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();
}

function drawAuthenticMask(headX, headY, gazeTargetX, gazeTargetY, isOpponent, isError = false) {
    ctx.save();
    ctx.fillStyle = isOpponent ? '#334155' : '#0284c7';
    ctx.strokeStyle = isError ? '#ef4444' : '#64748b';
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(headX - 11, headY + 9);
    ctx.quadraticCurveTo(headX + (isOpponent ? -14 : 14), headY + 18, headX + (isOpponent ? -8 : 8), headY + 24);
    ctx.lineTo(headX - (isOpponent ? -3 : 3), headY + 24);
    ctx.quadraticCurveTo(headX + 2, headY + 17, headX + 11, headY + 9);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = '#0b111e';
    ctx.strokeStyle = isError ? '#ef4444' : '#38bdf8';
    ctx.lineWidth = 2.0;
    ctx.beginPath();
    ctx.ellipse(headX, headY, 14, 17.5, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.restore();
}

function calculateEulerBladeBuckle(handX, handY, angleDeg, targetX, targetY) {
    const bladeLen = 114;
    const rad = (angleDeg * Math.PI) / 180;
    const undeflectedTipX = handX + Math.cos(rad) * bladeLen;
    const undeflectedTipY = handY + Math.sin(rad) * bladeLen;

    if (targetX <= 0 || undeflectedTipX < targetX) {
        return { isBent: false, p0: { x: handX, y: handY }, tip: { x: undeflectedTipX, y: undeflectedTipY } };
    }

    const tipX = targetX;
    const tipY = targetY;
    const penetration = undeflectedTipX - targetX;
    const nodeX = handX + (bladeLen * 0.68) * Math.cos(rad);
    const nodeY = handY + (bladeLen * 0.68) * Math.sin(rad);
    const normalAngle = rad - (Math.PI / 2);
    const buckleDepth = 12.0 + (penetration * 0.85);

    return {
        isBent: true,
        p0: { x: handX, y: handY },
        pCtrl: { x: nodeX + Math.cos(normalAngle) * buckleDepth, y: nodeY + Math.sin(normalAngle) * buckleDepth },
        tip: { x: tipX, y: tipY }
    };
}

function drawAuthenticFoil(handX, handY, angleDeg, targetX, targetY) {
    const spine = calculateEulerBladeBuckle(handX, handY, angleDeg, targetX, targetY);
    const rad = (angleDeg * Math.PI) / 180;

    ctx.save();
    ctx.translate(handX, handY);
    ctx.rotate(rad);
    ctx.fillStyle = '#94a3b8';
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 1.2;

    ctx.beginPath();
    ctx.ellipse(0, 0, 4.2, 11, 0, -Math.PI / 2, Math.PI / 2, true);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.lineCap = 'round';

    if (spine.isBent) {
        if (!wasInContactPreviousFrame) triggerHitStop(75, 4.2);
        wasInContactPreviousFrame = true;
        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(spine.p0.x, spine.p0.y);
        ctx.quadraticCurveTo(spine.pCtrl.x, spine.pCtrl.y, spine.tip.x, spine.tip.y);
        ctx.stroke();

        ctx.fillStyle = '#22c55e';
        ctx.beginPath();
        ctx.arc(spine.tip.x, spine.tip.y, 4.5, 0, Math.PI * 2);
        ctx.fill();
    } else {
        wasInContactPreviousFrame = false;
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(spine.p0.x, spine.p0.y);
        ctx.lineTo(spine.tip.x, spine.tip.y);
        ctx.stroke();
    }
    ctx.restore();
}

function drawFencingStrip(groundY) {
    ctx.fillStyle = '#0a0f1d';
    ctx.fillRect(0, groundY, BASE_WIDTH, BASE_HEIGHT - groundY);
    ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(BASE_WIDTH, groundY); ctx.stroke();
}

function drawU10Fencer(cfg) {
    const {
        pelvisX, pelvisY,
        frontFootX, frontFootY, frontTilt = 0,
        rearFootX, rearFootY, rearTilt = 0,
        rearFootTurned90 = true,
        torsoIncline = 0,
        armState = 'enGarde',
        armExtension = 0,
        bladeAngle = -5,
        targetSurfaceX = 0,
        targetSurfaceY = 0,
        isError = false
    } = cfg;

    // Enhanced Proportions for U10 clarity
    const femur = 54;
    const tibia = 50;

    const rearHipX = pelvisX - 6;
    const rearHipY = pelvisY;
    const rearAnkleY = rearFootY - 7;
    const rearIK = solveLegIK(rearHipX, rearHipY, rearFootX, rearAnkleY, femur, tibia, false);
    drawAnatomicalContouredLeg(rearHipX, rearHipY, rearIK.kx, rearIK.ky, rearFootX, rearAnkleY, false);
    drawAuthenticShoe(rearFootX, rearFootY, rearTilt, false, rearFootTurned90, false);

    const frontHipX = pelvisX + 6;
    const frontHipY = pelvisY;
    const frontAnkleY = frontFootY - 7;
    const frontIK = solveLegIK(frontHipX, frontHipY, frontFootX, frontAnkleY, femur, tibia, true);
    drawAnatomicalContouredLeg(frontHipX, frontHipY, frontIK.kx, frontIK.ky, frontFootX, frontAnkleY, true);
    drawAuthenticShoe(frontFootX, frontFootY, frontTilt, true, false, false);

    const shoulderX = pelvisX + 4 + (torsoIncline * 11);
    const shoulderY = pelvisY - 58;

    drawFoilLameVest(pelvisX, pelvisY, shoulderX, shoulderY, false, isError);

    const bShoulderX = shoulderX - 8;
    const bShoulderY = shoulderY + 9;
    ctx.save();
    ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 4.0; ctx.lineCap = 'round';
    const bElbowX = bShoulderX - 14;
    const bElbowY = bShoulderY - 14;
    const bHandX = bElbowX + 4;
    const bHandY = bElbowY - 14;
    ctx.beginPath(); ctx.moveTo(bShoulderX, bShoulderY);
    ctx.lineTo(bElbowX, bElbowY); ctx.lineTo(bHandX, bHandY); ctx.stroke();
    ctx.restore();

    const headX = shoulderX + 4;
    const headY = shoulderY - 20;
    drawAuthenticMask(headX, headY, 0, 0, false, isError);

    const fShoulderX = shoulderX + 8;
    const fShoulderY = shoulderY + 11;

    let handX, handY;
    ctx.save();
    ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = 4.2; ctx.lineCap = 'round';

    if (armState === 'enGarde') {
        handX = fShoulderX + 26;
        handY = fShoulderY + 2;
        const elbowX = fShoulderX + 13;
        const elbowY = fShoulderY + 13;
        ctx.beginPath(); ctx.moveTo(fShoulderX, fShoulderY);
        ctx.lineTo(elbowX, elbowY); ctx.lineTo(handX, handY); ctx.stroke();
        ctx.restore();
        drawAuthenticFoil(handX, handY, bladeAngle, 0, 0);
    } else {
        const maxReach = 50;
        const currentReach = 26 + (armExtension * (maxReach - 26));
        handX = fShoulderX + currentReach;
        handY = fShoulderY - (armExtension * 3.5);
        const elbowX = fShoulderX + (currentReach * 0.52);
        const elbowY = fShoulderY + (13 * (1 - armExtension));
        ctx.beginPath(); ctx.moveTo(fShoulderX, fShoulderY);
        ctx.lineTo(elbowX, elbowY); ctx.lineTo(handX, handY); ctx.stroke();
        ctx.restore();
        drawAuthenticFoil(handX, handY, bladeAngle, targetSurfaceX, targetSurfaceY);
    }
}

function renderDrill1_LStance(t) {
    drawFencingStrip(GROUND_Y);
    const fencerX = 410;
    const phase = t < 9000 ? 0 : (t < 18000 ? 1 : 2);
    let stanceWidth = 16;
    let rearTurned = false;

    clearErrorZones();

    if (phase === 0) {
        stanceWidth = 16; rearTurned = false;
        registerErrorZone('d1_foot', fencerX - 8, GROUND_Y - 9, 26, () => {
            effectiveElapsed = 0 * DRILL_DURATION + 9005;
        });
    } else if (phase === 1) {
        stanceWidth = 16; rearTurned = true;
    } else {
        stanceWidth = 52; rearTurned = true;
    }

    drawU10Fencer({
        pelvisX: fencerX, pelvisY: 246,
        frontFootX: fencerX + (stanceWidth / 2), frontFootY: GROUND_Y,
        rearFootX: fencerX - (stanceWidth / 2), rearFootY: GROUND_Y,
        rearFootTurned90: rearTurned,
        isError: phase === 0
    });
}

function renderDrill2_EnGarde(t) {
    drawFencingStrip(GROUND_Y);
    const fencerX = 410;
    const phase = t < 10000 ? 0 : 1;
    const pelvisDrop = phase === 0 ? 0 : 14;

    clearErrorZones();

    if (phase === 0) {
        registerErrorZone('d2_knee', fencerX, 264, 30, () => {
            effectiveElapsed = 1 * DRILL_DURATION + 10005;
        });
    }

    drawU10Fencer({
        pelvisX: fencerX, pelvisY: 246 + pelvisDrop,
        frontFootX: fencerX + 26, frontFootY: GROUND_Y,
        rearFootX: fencerX - 26, rearFootY: GROUND_Y,
        rearFootTurned90: true,
        isError: phase === 0
    });
}

function render() {
    const now = performance.now();
    const dt = now - lastFrameTime;
    lastFrameTime = now;

    if (now >= hitStopUntil && !isPaused) {
        effectiveElapsed = (effectiveElapsed + dt * playbackMultiplier) % TOTAL_MASTER_TIME;
        updateDrillStateMachine(effectiveElapsed);
    }

    ctx.clearRect(0, 0, BASE_WIDTH, BASE_HEIGHT);
    applyCameraTransform();

    const drillElapsed = effectiveElapsed % DRILL_DURATION;

    if (currentDrill === 0) renderDrill1_LStance(drillElapsed);
    else if (currentDrill === 1) renderDrill2_EnGarde(drillElapsed);
    else renderDrill1_LStance(drillElapsed); // Fallback

    drawActiveErrorReticles();
    updateAndDrawRipples();
    restoreCameraTransform();

    requestAnimationFrame(render);
}

function switchDrill(drillIdx) {
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    currentDrill = drillIdx;
    effectiveElapsed = drillIdx * DRILL_DURATION;
    currentSubPhase = -1;
    lastFrameTime = performance.now();
    updateDrillStateMachine(effectiveElapsed);
}

function restartMasterTraining() {
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    initAudio();
    isPaused = false;
    playIcon.style.display = 'none';
    pauseIcon.style.display = 'block';
    effectiveElapsed = currentDrill * DRILL_DURATION;
    currentSubPhase = -1;
    lastFrameTime = performance.now();
    updateDrillStateMachine(effectiveElapsed);
}

function togglePause() {
    initAudio();
    isPaused = !isPaused;
    if (isPaused) {
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    } else {
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
        lastFrameTime = performance.now();
    }
}

render();
</script>
